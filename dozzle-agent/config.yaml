---
name: "Dozzle Agent"
description: "Dozzle Agent for HASSIO"
version: "0.3.16"
dozzle.version: "10.2.0"
slug: "dozzle-agent"
url: "https://github.com/Erreur32/homeassistant-dozzle-agent"
issues: "https://github.com/Erreur32/homeassistant-dozzle-agent/issues"
documentation: "https://github.com/Erreur32/homeassistant-dozzle-agent/wiki"
# Optional: sign images with Codenotary CAS for chain of trust (set to maintainer email used for signing)
# codenotary: "maintainer@example.com"

arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

init: false
startup: application
boot: auto
# Port mapping is used instead of host_network for better security (HA 2026 audit).
host_network: false
docker_api: true

# Configuration Options
options:
  log_level: "info"
  hostname: ""

schema:
  log_level: list(debug|info|error)
  hostname: str

options_description:
  log_level: "Log level"
  hostname: "Agent hostname (optional)"

# Port Configuration
ports:
  "7007/tcp": 7007
ports_description:
  "7007/tcp": "Dozzle Agent Port"

# System Configuration
# NOTE: watchdog removed - dozzle agent only serves gRPC over TLS on port 7007,
# plain HTTP pings always fail causing restarts every ~4 minutes.
# s6 supervisor handles process restarts natively.
# Selective device access only (avoid udev: true when using devices list to prevent HA warning).
udev: false
devices:
  - /dev/log
  - /dev/kmsg

# System Permissions
hassio_api: true
hassio_role: default
auth_api: true

# Required for Docker API (list containers, stream logs). Without these the add-on does not work; score stays 1.
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH

# Map read-only when write is not needed (HA 2026 security score). Dozzle agent does not write to these.
map:
  - config:ro
  - ssl:ro
  - share:ro
  - backup:ro
  - media:ro

